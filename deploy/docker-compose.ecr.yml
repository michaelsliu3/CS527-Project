# Pull pre-built images from Amazon ECR (used by EC2 + GitHub Actions deploy).
# Prerequisites on the host: deploy/.env (secrets) + ECR login (IAM role or aws ecr get-login-password).
#
#   export IMAGE_TAG=main   # or a git SHA pushed by CI
#   aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
#   docker compose -f docker-compose.ecr.yml pull && docker compose -f docker-compose.ecr.yml up -d

services:
  api:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_API:-plzbuyme-api}:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:5081:8080"
    # GT7 GM seed-from-manifest: mount host JSON into the container (API content root is /app).
    # Set GT7_MANIFEST_HOST in deploy/.env to the host path; file must exist before `compose up`
    # (otherwise Docker may create a directory at that path). Use :Z on SELinux (Amazon Linux).
    volumes:
      - ${GT7_MANIFEST_HOST:-/var/lib/plzbuyme/gt7-car-thumbnails.manifest.json}:/app/gt7-car-thumbnails.manifest.json:ro,Z
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Enabled: "true"
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Cors__AllowedOrigins: ${CORS_ORIGINS}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-PlzBuyMe}
      Jwt__Audience: ${JWT_AUDIENCE:-PlzBuyMeUsers}
      Jwt__ExpiresInMinutes: ${JWT_EXPIRES_MINUTES:-60}
      MediaStorage__ServiceBaseUrl: http://cdn:8080
      Gt7CarManifest__Path: /app/gt7-car-thumbnails.manifest.json

  cdn:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY_CDN:-plzbuyme-cdn}:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:5090:8080"
    volumes:
      - cdn-storage:/app/storage
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Cors__AllowedOrigins: ${CORS_ORIGINS}
      MediaStorage__StorageRoot: storage
      MediaStorage__PublicBaseUrl: ${CDN_PUBLIC_URL}

volumes:
  cdn-storage:
