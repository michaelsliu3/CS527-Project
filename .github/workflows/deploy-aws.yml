# Deploy backend images to ECR + pull on EC2; sync frontend to S3 and invalidate CloudFront.
# One-time AWS setup (RDS, EC2, Nginx, ECR repos, IAM) is still manual or separate IaC — see deploy/README.md.
#
# Enable by setting repository variable AWS_DEPLOY_ENABLED = true and configuring secrets/vars listed in deploy/README.md.

name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_API: ${{ vars.ECR_REPOSITORY_API || 'plzbuyme-api' }}
  ECR_REPOSITORY_CDN: ${{ vars.ECR_REPOSITORY_CDN || 'plzbuyme-cdn' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-ecr:
    name: Build & push API + CDN to ECR
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set ECR registry host
        run: echo "ECR_REGISTRY=${{ steps.ecr.outputs.registry }}" >> "$GITHUB_ENV"

      - name: Build and push API image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY_API:latest" \
            plzbuyme-backend/PlzBuyMe.Api
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_API:latest"

      - name: Build and push CDN image
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY_CDN:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY_CDN:latest" \
            plzbuyme-cdn
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_CDN:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY_CDN:latest"

  deploy-ec2:
    name: Pull images on EC2
    runs-on: ubuntu-latest
    needs: build-push-ecr
    if: vars.AWS_DEPLOY_ENABLED == 'true' && vars.EC2_HOST != '' && vars.EC2_DEPLOY_PATH != ''
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY_API: ${{ env.ECR_REPOSITORY_API }}
          ECR_REPOSITORY_CDN: ${{ env.ECR_REPOSITORY_CDN }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: ECR_REGISTRY,IMAGE_TAG,AWS_REGION,ECR_REPOSITORY_API,ECR_REPOSITORY_CDN
          script: |
            set -euo pipefail
            DEPLOY_PATH='${{ vars.EC2_DEPLOY_PATH }}'
            REPO_ROOT="$(cd "$DEPLOY_PATH/.." && pwd)"
            cd "$REPO_ROOT"
            git fetch origin main
            git checkout -B main "origin/main"
            cd "$DEPLOY_PATH"
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            export ECR_REGISTRY IMAGE_TAG ECR_REPOSITORY_API ECR_REPOSITORY_CDN
            docker compose -f docker-compose.ecr.yml pull
            docker compose -f docker-compose.ecr.yml up -d

  deploy-frontend:
    name: Build SPA → S3 + CloudFront invalidation
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ENABLED == 'true' && vars.S3_FRONTEND_BUCKET != ''
    defaults:
      run:
        working-directory: plzbuyme-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plzbuyme-frontend/package-lock.json

      # VITE_CDN_URL should match deploy CDN_PUBLIC_URL (browser origin for /media/...).
      - name: Install and build
        run: npm ci && npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CDN_URL: ${{ vars.VITE_CDN_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${{ vars.S3_FRONTEND_BUCKET }}/" --delete

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
